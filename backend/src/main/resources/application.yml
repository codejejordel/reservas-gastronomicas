spring:
  application:
    name: reservasfy

#  datasource:
#    url: jdbc:postgresql://localhost:5432/reservas_v1
#    username: postgres
#    password: admin
#    driver-class-name: org.postgresql.Driver
#    hikari:
#      maximum-pool-size: 10
#      minimum-idle: 2
#      connection-timeout: 30000

  datasource:
    url: ${DB_HOST:jdbc:postgresql://localhost:5432/reservas}
    username: ${DB_USER:reservas_user}
    password: ${DB_PASSWORD:reservas_pass_dev}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC
    open-in-view: false
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080
  servlet:
    context-path: /api
  error:
    include-message: always
    include-binding-errors: always

app:
  reserva:
    cargo-servicio-unitario: ${TURNIFY_CARGO_SERVICIO_UNITARIO:500}
  upload:
    dir: ${UPLOAD_DIR:./uploads}
  cors:
    allowed-origins: http://localhost:3000,http://localhost:5173
  jwt:
    secret: ${JWT_SECRET:cambiar-esto-en-produccion-debe-ser-largo-y-aleatorio-minimo-256-bits}
    expiration-ms: ${JWT_EXPIRATION_MS:900000}
  auth:
    password-reset:
      expiration-minutes: ${PASSWORD_RESET_EXPIRATION_MINUTES:10}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
  mercadopago:
    access-token: ${MP_ACCESS_TOKEN:}
    collector-id: ${MP_COLLECTOR_ID:}
    webhook-secret: ${MP_WEBHOOK_SECRET:}
    webhook-base-url: ${MP_WEBHOOK_BASE_URL:http://localhost:8080/api}
  frontend:
    url: ${FRONTEND_URL:http://localhost:3000}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

logging:
  level:
    root: INFO
    com.reservas: DEBUG
    org.springframework.web: INFO
    org.springframework.security: INFO
#    org.hibernate.SQL: DEBUG
