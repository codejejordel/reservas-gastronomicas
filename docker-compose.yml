services:
  postgres:
    image: postgres:16-alpine
    container_name: reservas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-reservas}
      POSTGRES_USER: ${POSTGRES_USER:-reservas_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reservas_pass_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-reservas_user} -d ${POSTGRES_DB:-reservas}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - reservas-net

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: reservas-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@reservas.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - reservas-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: reservas-backend
    restart: unless-stopped
    environment:
      DB_HOST: ${DB_HOST:-jdbc:postgresql://postgres:5432/reservas}
      DB_USER: ${DB_USER:-reservas_user}
      DB_PASSWORD: ${DB_PASSWORD:-reservas_pass_dev}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      MP_ACCESS_TOKEN: ${MP_ACCESS_TOKEN:-}
      MP_COLLECTOR_ID: ${MP_COLLECTOR_ID:-}
      MP_WEBHOOK_SECRET: ${MP_WEBHOOK_SECRET:-}
      MP_WEBHOOK_BASE_URL: ${MP_WEBHOOK_BASE_URL:-http://localhost:8080/api}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    networks:
      - reservas-net

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: "on-failure:3"
    command: tunnel --no-autoupdate --url http://backend:8080
    depends_on:
      - backend
    networks:
      - reservas-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    container_name: reservas-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    networks:
      - reservas-net

  cloudflared-frontend:
    image: cloudflare/cloudflared:latest
    restart: "on-failure:3"
    command: tunnel --no-autoupdate --url http://frontend:80
    depends_on:
      - frontend
    networks:
      - reservas-net

volumes:
  postgres-data:
    driver: local
  pgadmin-data:
    driver: local

networks:
  reservas-net:
    driver: bridge
